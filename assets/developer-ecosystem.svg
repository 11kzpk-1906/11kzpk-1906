<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">A map of Arnav's developer interests</title>
<desc id="desc">A friendly, dark lavender visual showing curiosity, software engineering, AI, developer tools, and full-stack projects connected through a learning and building cycle.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100e18"/><stop offset=".55" stop-color="#1c1728"/><stop offset="1" stop-color="#29213b"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1d2ff"/><stop offset="1" stop-color="#9272c7"/></linearGradient>
  <linearGradient id="connection" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8d76bd" stop-opacity=".12"/><stop offset=".5" stop-color="#d6c2fa" stop-opacity=".8"/><stop offset="1" stop-color="#8d76bd" stop-opacity=".12"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c9b2f4" stroke-opacity=".055"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="1200" height="520" rx="26" fill="url(#background)"/>
<rect width="1200" height="520" rx="26" fill="url(#grid)"/>
<circle cx="600" cy="260" r="170" fill="#aa8bdd" opacity=".11" filter="url(#glow)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="58" y="58" fill="#cdb9f1" font-size="13" letter-spacing="3.5">A CURIOSITY-DRIVEN WORKSPACE</text>
  <text x="1142" y="58" text-anchor="end" fill="#a99bb9" font-size="11" letter-spacing="2">LEARN • MAKE • SHARE</text>
  <g fill="none" stroke="url(#connection)" stroke-width="2">
    <path d="M392 145L475 214M808 145L725 214M392 375L475 306M808 375L725 306"/>
    <circle cx="600" cy="260" r="148" stroke="#c7b0ed" stroke-opacity=".22" stroke-dasharray="4 10"/>
    <circle cx="600" cy="260" r="185" stroke="#c7b0ed" stroke-opacity=".1"/>
  </g>
  <g fill="#e1d2ff">
    <circle cx="434" cy="180" r="3"/><circle cx="766" cy="180" r="3"/>
    <circle cx="434" cy="340" r="3"/><circle cx="766" cy="340" r="3"/>
  </g>
  <rect x="438" y="174" width="324" height="172" rx="24" fill="#171321" stroke="#b59add" stroke-opacity=".7"/>
  <rect x="450" y="186" width="300" height="148" rx="17" fill="none" stroke="#e3d6fa" stroke-opacity=".13"/>
  <text x="600" y="220" text-anchor="middle" fill="#bba2e7" font-size="11" letter-spacing="3">THE WAY I LEARN</text>
  <text x="600" y="267" text-anchor="middle" fill="url(#accent)" font-size="35" font-weight="700">STAY CURIOUS.</text>
  <text x="600" y="298" text-anchor="middle" fill="#f0eaf8" font-size="16">Build something useful.</text>
  <text x="600" y="320" text-anchor="middle" fill="#a99bb9" font-size="10" letter-spacing="1.8">ARNAV PAWAR • STUDENT DEVELOPER</text>
  <g>
    <rect x="78" y="94" width="314" height="102" rx="16" fill="#211b2e" stroke="#8d76bd" stroke-opacity=".65"/>
    <text x="104" y="128" fill="#cbb7ef" font-size="11" letter-spacing="2">01 / FOUNDATIONS</text>
    <text x="104" y="162" fill="#f3eef9" font-size="21" font-weight="600">Software engineering</text>
    <rect x="808" y="94" width="314" height="102" rx="16" fill="#211b2e" stroke="#8d76bd" stroke-opacity=".65"/>
    <text x="834" y="128" fill="#cbb7ef" font-size="11" letter-spacing="2">02 / EXPLORATION</text>
    <text x="834" y="162" fill="#f3eef9" font-size="21" font-weight="600">AI &amp; automation</text>
    <rect x="78" y="324" width="314" height="102" rx="16" fill="#211b2e" stroke="#8d76bd" stroke-opacity=".65"/>
    <text x="104" y="358" fill="#cbb7ef" font-size="11" letter-spacing="2">03 / PRACTICAL TOOLS</text>
    <text x="104" y="392" fill="#f3eef9" font-size="21" font-weight="600">Developer experience</text>
    <rect x="808" y="324" width="314" height="102" rx="16" fill="#211b2e" stroke="#8d76bd" stroke-opacity=".65"/>
    <text x="834" y="358" fill="#cbb7ef" font-size="11" letter-spacing="2">04 / MAKING</text>
    <text x="834" y="392" fill="#f3eef9" font-size="21" font-weight="600">Full-stack projects</text>
  </g>
  <text x="600" y="477" text-anchor="middle" fill="#b9a8d3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2.5">PYTHON • TYPESCRIPT • REACT • FASTAPI • GIT</text>
</g>
</svg>