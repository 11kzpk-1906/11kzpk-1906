<g font-family="Arial,Helvetica,sans-serif">
 <text x="58" y="58" fill="#c9b2f4" font-size="14" letter-spacing="4">THE DEVELOPER ECOSYSTEM</text>
 <text x="1140" y="58" fill="#8f829f" font-size="12" text-anchor="end" letter-spacing="2">LEARN / BUILD / ITERATE</text>
 <rect x="445" y="171" width="310" height="178" rx="22" fill="#171321" stroke="#9f83d1" stroke-opacity=".7"/>
 <rect x="457" y="183" width="286" height="154" rx="15" fill="none" stroke="#d8c5ff" stroke-opacity=".13"/>
 <text x="600" y="220" text-anchor="middle" fill="#a98bd9" font-size="12" letter-spacing="3">CORE PRINCIPLE</text>
 <text x="600" y="267" text-anchor="middle" fill="url(#core)" font-size="35" font-weight="700">BUILD.</text>
 <text x="600" y="300" text-anchor="middle" fill="#eee7f8" font-size="17">Test. Improve. Repeat.</text>
 <text x="600" y="322" text-anchor="middle" fill="#93869f" font-size="10" letter-spacing="2">ARNAV PAWAR</text>
 <g>
  <rect x="92" y="98" width="300" height="94" rx="14" fill="#211b2e" stroke="#8067ad" stroke-opacity=".7"/>
  <text x="116" y="132" fill="#d9c7fa" font-size="13" letter-spacing="2">01 / ENGINEERING</text><text x="116" y="161" fill="#f2edf9" font-size="21" font-weight="600">Software systems</text>
  <rect x="808" y="98" width="300" height="94" rx="14" fill="#211b2e" stroke="#8067ad" stroke-opacity=".7"/>
  <text x="832" y="132" fill="#d9c7fa" font-size="13" letter-spacing="2">02 / INTELLIGENCE</text><text x="832" y="161" fill="#f2edf9" font-size="21" font-weight="600">AI &amp; automation</text>
  <rect x="92" y="333" width="300" height="94" rx="14" fill="#211b2e" stroke="#8067ad" stroke-opacity=".7"/>
  <text x="116" y="367" fill="#d9c7fa" font-size="13" letter-spacing="2">03 / TOOLING</text><text x="116" y="396" fill="#f2edf9" font-size="21" font-weight="600">Developer experience</text>
  <rect x="808" y="333" width="300" height="94" rx="14" fill="#211b2e" stroke="#8067ad" stroke-opacity=".7"/>
