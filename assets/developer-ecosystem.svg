<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Arnav's developer ecosystem</title><desc id="d">A visual map connecting software engineering, AI, developer tools, and full-stack development around a central build, test, improve cycle.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#100e18"/><stop offset=".55" stop-color="#1c1728"/><stop offset="1" stop-color="#28203a"/></linearGradient>
 <linearGradient id="line" x2="1"><stop stop-color="#8d76bd" stop-opacity=".15"/><stop offset=".5" stop-color="#c9b2f4" stop-opacity=".85"/><stop offset="1" stop-color="#8d76bd" stop-opacity=".15"/></linearGradient>
 <linearGradient id="core" x2="1" y2="1"><stop stop-color="#d8c5ff"/><stop offset="1" stop-color="#9272c7"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c9b2f4" opacity=".18"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="520" rx="26" fill="url(#bg)"/><rect width="1200" height="520" rx="26" fill="url(#dots)"/>
<circle cx="600" cy="260" r="170" fill="#9e80d4" opacity=".08" filter="url(#soft)"/>
<g fill="none" stroke="url(#line)" stroke-width="2">
